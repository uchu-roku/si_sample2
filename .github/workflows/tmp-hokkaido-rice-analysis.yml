name: Temporary Hokkaido rice analysis

on:
  push:
    branches:
      - tmp-hokkaido-rice-analysis
    paths-ignore:
      - 'analysis/output_explore/**'
      - 'analysis/output/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-hokkaido-rice-analysis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas openpyxl xlrd
      - run: python analysis/explore_hokkaido_rice_data.py
      - name: Commit exploration outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/output_explore
          git commit -m "Add exploration outputs [skip ci]" || exit 0
          git push origin HEAD:tmp-hokkaido-rice-analysis
